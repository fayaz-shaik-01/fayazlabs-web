name: Ingest Content to AI Service

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.github/workflows/ingest-content.yml'
  workflow_dispatch:
    inputs:
      force_reingest:
        description: 'Force full rebuild of the index'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Secrets live in the protected 'production' environment (required reviewers / main-only).
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed content files
        id: detect
        env:
          FORCE: ${{ github.event.inputs.force_reingest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "mode=rebuild" >> $GITHUB_OUTPUT
            find content -name "*.mdx" -type f > upsert_files.txt
            touch deleted_files.txt
          else
            echo "mode=update" >> $GITHUB_OUTPUT
            git diff --name-only --diff-filter=d HEAD~1 HEAD | grep -E "^content/.*\.mdx$" > upsert_files.txt || true
            git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -E "^content/.*\.mdx$" > deleted_files.txt || true
          fi

          UPSERT_COUNT=$(wc -l < upsert_files.txt | tr -d ' ')
          DELETE_COUNT=$(wc -l < deleted_files.txt | tr -d ' ')
          echo "upsert_count=$UPSERT_COUNT" >> $GITHUB_OUTPUT
          echo "delete_count=$DELETE_COUNT" >> $GITHUB_OUTPUT
          echo "total=$((UPSERT_COUNT + DELETE_COUNT))" >> $GITHUB_OUTPUT

      - name: Display changes
        run: |
          echo "Mode: ${{ steps.detect.outputs.mode }}"
          echo "Files to upsert: ${{ steps.detect.outputs.upsert_count }}"
          echo "Files to delete: ${{ steps.detect.outputs.delete_count }}"
          [ -s upsert_files.txt ] && echo "--- Upsert ---" && cat upsert_files.txt || true
          [ -s deleted_files.txt ] && echo "--- Delete ---" && cat deleted_files.txt || true

      - name: Build and send index payload
        if: steps.detect.outputs.total != '0'
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          ADMIN_INGEST_SECRET: ${{ secrets.ADMIN_INGEST_SECRET }}
        run: |
          # Build JSON payload using Python — matches AdminIngestRequest format
          python3 -c "
          import json, sys

          files = []

          # Upsert files: send raw content, AI service handles parsing
          with open('upsert_files.txt') as f:
              for line in f:
                  path = line.strip()
                  if not path:
                      continue
                  try:
                      with open(path) as content_file:
                          content = content_file.read()
                      files.append({
                          'file_path': path,
                          'content': content,
                          'action': 'upsert'
                      })
                  except FileNotFoundError:
                      print(f'Warning: {path} not found, skipping')

          # Deleted files
          with open('deleted_files.txt') as f:
              for line in f:
                  path = line.strip()
                  if not path:
                      continue
                  files.append({
                      'file_path': path,
                      'content': '',
                      'action': 'delete'
                  })

          if not files:
              print('No files to process')
              sys.exit(0)

          import os
          MODE=os.environ['MODE']
          clear_existing = MODE == 'rebuild'

          # Save files list for batching
          with open('files.json', 'w') as f:
              json.dump(files, f)

          print(f'Total files: {len(files)} ({sum(1 for f in files if f[\"action\"]==\"upsert\")} upsert, {sum(1 for f in files if f[\"action\"]==\"delete\")} delete)')
          print(f'clear_existing: {clear_existing}')
          "

          # Send files in batches to avoid 8KB payload limit
          python3 -c "
          import json, os, subprocess, sys, tempfile

          with open('files.json') as f:
              files = json.load(f)

          import os
          MODE=os.environ['MODE']
          clear_existing = MODE == 'rebuild'

          # The admin secret goes in a 0600 header file passed with curl -H @file,
          # so it never appears on the command line (process list / logs).
          hdr = tempfile.NamedTemporaryFile('w', delete=False, suffix='.hdr')
          os.chmod(hdr.name, 0o600)
          hdr.write('X-Admin-Ingest-Secret: ' + os.environ['ADMIN_INGEST_SECRET'] + '\n')
          hdr.close()
          url = os.environ['PLATFORM_URL'] + '/api/admin/ingest'

          # Send 2 files per batch (conservative for MDX content)
          batch_size = 2
          total_batches = (len(files) + batch_size - 1) // batch_size

          for i in range(0, len(files), batch_size):
              batch = files[i:i + batch_size]
              batch_num = (i // batch_size) + 1

              payload = {
                  'files': batch,
                  'clear_existing': clear_existing if i == 0 else False  # Only clear on first batch
              }

              body = tempfile.NamedTemporaryFile('w', delete=False, suffix='.json')
              json.dump(payload, body)
              body.close()

              print(f'Sending batch {batch_num}/{total_batches} ({len(batch)} files)...')
              result = subprocess.run([
                  'curl', '-s', '-X', 'POST',
                  url,
                  '-H', 'Content-Type: application/json',
                  '-H', '@' + hdr.name,
                  '-d', '@' + body.name,
                  '-w', '\n%{http_code}'
              ], capture_output=True, text=True)
              os.unlink(body.name)

              output = result.stdout
              http_code = output.split('\n')[-1]
              response_body = '\n'.join(output.split('\n')[:-1])

              print(f'Batch {batch_num} HTTP Status: {http_code}')

              if http_code != '200':
                  print(f'Batch {batch_num} failed: {response_body}')
                  sys.exit(1)

          os.unlink(hdr.name)
          print('All batches sent successfully')
          "

      - name: No content changes
        if: steps.detect.outputs.total == '0'
        run: echo "No content files changed. Skipping ingestion."
